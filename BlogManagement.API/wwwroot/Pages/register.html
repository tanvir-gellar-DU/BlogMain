    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        body {
            background-color: #f7f9fb;
            background-image: radial-gradient(#c6c5d4 0.5px, transparent 0.5px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-body-md text-on-surface">
    <!-- TopAppBar -->
   
    <!-- Main Content Canvas -->
    <main class="flex-grow flex items-center justify-center px-md py-xl mt-16">
        <div class="w-full max-w-[520px] bg-surface-container-lowest rounded-xl border border-outline-variant shadow-sm overflow-hidden animate-in fade-in slide-in-from-bottom-4 duration-700">
            <!-- Header Section -->
            <div class="px-lg pt-lg pb-md text-center">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-fixed mb-md">
                    <span class="material-symbols-outlined text-on-primary-fixed text-[32px]">edit_square</span>
                </div>
                <h1 class="font-headline-lg text-headline-lg text-on-background mb-base">Join the Community</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Create your account to start writing and sharing your stories with the world.</p>
            </div>
            <!-- Registration Form -->
            <form id="registerForm" class="px-lg pb-lg space-y-md">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
                    <div class="space-y-xs">
                        <label class="font-label-md text-label-md text-on-surface-variant ml-xs">First Name</label>
                        <div class="relative group">
                            <input id="firstName" class="w-full h-12 bg-surface-container-low border-none rounded-lg px-md focus:ring-2 focus:ring-primary transition-all font-body-md text-body-md placeholder:text-outline-variant" placeholder="Jane" required type="text" />
                        </div>
                    </div>
                    <div class="space-y-xs">
                        <label class="font-label-md text-label-md text-on-surface-variant ml-xs">Last Name</label>
                        <div class="relative group">
                            <input id="lastName" class="w-full h-12 bg-surface-container-low border-none rounded-lg px-md focus:ring-2 focus:ring-primary transition-all font-body-md text-body-md placeholder:text-outline-variant" placeholder="Doe" required type="text" />
                        </div>
                    </div>
                </div>
                <div class="space-y-xs">
                    <label class="font-label-md text-label-md text-on-surface-variant ml-xs">Email Address</label>
                    <div class="relative group">
                        <input id="email" class="w-full h-12 bg-surface-container-low border-none rounded-lg px-md focus:ring-2 focus:ring-primary transition-all font-body-md text-body-md placeholder:text-outline-variant" placeholder="jane.doe@example.com" required type="email" />
                    </div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-md">
                    <div class="space-y-xs">
                        <label class="font-label-md text-label-md text-on-surface-variant ml-xs">Password</label>
                        <div class="relative group">
                            <input id="password" class="w-full h-12 bg-surface-container-low border-none rounded-lg px-md focus:ring-2 focus:ring-primary transition-all font-body-md text-body-md" placeholder="••••••••" required type="password" />
                        </div>
                    </div>
                    <div class="space-y-xs">
                        <label class="font-label-md text-label-md text-on-surface-variant ml-xs">Confirm Password</label>
                        <div class="relative group">
                            <input id="confirmPassword" class="w-full h-12 bg-surface-container-low border-none rounded-lg px-md focus:ring-2 focus:ring-primary transition-all font-body-md text-body-md" placeholder="••••••••" required type="password" />
                        </div>
                    </div>
                </div>

                <div class="flex items-center gap-sm py-base">
                    <input class="w-5 h-5 rounded border-outline-variant text-primary focus:ring-primary cursor-pointer" id="terms" type="checkbox" />
                    <label class="font-label-md text-label-md text-on-surface-variant cursor-pointer select-none" for="terms">
                        I agree to the <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.
                    </label>
                </div>
                <button class="w-full h-14 bg-primary text-on-primary font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-base" type="submit">
                    Register
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                </button>
               
                <div class="grid grid-cols-2 gap-md">
                   
                </div>
            </form>
            <div class="bg-surface-container-low px-lg py-md text-center border-t border-outline-variant">
                <p class="font-label-md text-label-md text-on-surface-variant">
                    Already have an account?
                    <a class="text-primary font-bold hover:underline ml-xs" href="/Pages/login.html">Login</a>
                </p>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="bg-surface-container-lowest border-t border-outline-variant">
        <div class="flex flex-col md:flex-row justify-between items-center px-md py-lg max-w-container-max mx-auto w-full">
            <div class="flex flex-col items-center md:items-start gap-xs mb-md md:mb-0">
                <span class="font-display text-headline-md text-on-surface">BS23-Blog</span>
                <p class="font-label-sm text-label-sm text-on-surface-variant">©  BS23-Blog Inc. All rights reserved.</p>
            </div>
            <div class="flex items-center gap-lg">
                <a class="text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline font-label-sm text-label-sm" href="#">Privacy Policy</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline font-label-sm text-label-sm" href="#">Terms</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline font-label-sm text-label-sm" href="#">Careers</a>
                <a class="text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline font-label-sm text-label-sm" href="#">Contact</a>
            </div>
        </div>
    </footer>
    <script>
        // Simple input focus effects
        const inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        $('#registerForm').on('submit', function(e) {
            e.preventDefault();
            const firstName = $('#firstName').val();
            const lastName = $('#lastName').val();
            const email = $('#email').val();
            const password = $('#password').val();
            const confirmPassword = $('#confirmPassword').val();
            const role = 'Author';

            if (password !== confirmPassword) {
                App.showToast('Passwords do not match.', 'error');
                return;
            }

            if (!$('#terms').is(':checked')) {
                App.showToast('You must agree to the Terms of Service.', 'error');
                return;
            }

            const btn = $(this).find('button[type="submit"]');
            const originalContent = btn.html();
            btn.html('<span class="material-symbols-outlined animate-spin">progress_activity</span> Registering...').prop('disabled', true);

            $.ajax({
                url: '/api/auth/register',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    firstName: firstName,
                    lastName: lastName,
                    email: email,
                    password: password,
                    role: role
                }),
                success: function(response) {
                    if (response.success) {
                        App.showToast('Registration successful! Redirecting to login...');
                        setTimeout(function() {
                            window.location.href = '/Pages/login.html';
                        }, 1500);
                    } else {
                        App.showToast(response.message || 'Registration failed.', 'error');
                        btn.html(originalContent).prop('disabled', false);
                    }
                },
                error: function(xhr) {
                    const err = xhr.responseJSON ? xhr.responseJSON.message : 'Registration failed.';
                    App.showToast(err, 'error');
                    btn.html(originalContent).prop('disabled', false);
                }
            });
        });
    </script>
</body>
</html>
